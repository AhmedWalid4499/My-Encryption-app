name: Test & build Windows and Mac apps

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt libraries
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libegl1 libxkbcommon0
      - name: Install LibreOffice (optional - enables the Office re-save tests)
        # a slow/hung Ubuntu mirror must not block a release: the re-save tests skip themselves without it
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libreoffice-writer libreoffice-impress libreoffice-calc
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests on Windows (incl. cross-platform cipher vectors)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build app with PyInstaller
        run: pyinstaller packaging/veilmark.spec --noconfirm --clean
      - name: Smoke-test the built app (embed + extract a real PowerPoint)
        shell: pwsh
        env:
          VEILMARK_HOME: ${{ runner.temp }}\vmhome
        run: |
          .\dist\VeilMark\veilmark-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sys; sys.path.insert(0, 'tests'); from samples import make_pptx; make_pptx(r'${{ runner.temp }}\smoke.pptx')"
          .\dist\VeilMark\veilmark-cli.exe embed "${{ runner.temp }}\smoke.pptx" --text "CI smoke test" --footer
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = .\dist\VeilMark\veilmark-cli.exe extract "${{ runner.temp }}\smoke - watermarked.pptx" | Out-String
          $out
          if ($out -notmatch "Watermark text: CI smoke test") { Write-Error "built app could not extract the watermark"; exit 1 }
          $upd = .\dist\VeilMark\veilmark-cli.exe check-update | Out-String
          $upd
          if ($upd -notmatch "up to date|is available") { Write-Error "built app could not check GitHub for updates"; exit 1 }
      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path veilmark/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match app version $v (veilmark/__init__.py)"; exit 1
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss
      - name: Test the installer (silent install, then run the installed copy)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = "${{ runner.temp }}\vm-install"
          # wait for the installer process only (Start-Process -Wait would also wait for anything it launches)
          $p = Start-Process -PassThru -FilePath dist\VeilMark-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOLAUNCH","/DIR=`"$dir`""
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Write-Error "installer exit code $($p.ExitCode)"; exit 1 }
          Get-Process VeilMark -ErrorAction SilentlyContinue | Stop-Process -Force
          $v = & "$dir\veilmark-cli.exe" --version
          $v
          if ($v -notmatch "${{ steps.ver.outputs.version }}") { Write-Error "installed copy reports '$v'"; exit 1 }
      - name: Zip portable version and write checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VeilMark\* -DestinationPath dist\VeilMark-Portable.zip
          $lines = foreach ($f in "VeilMark-Setup.exe", "VeilMark-Portable.zip") {
            "{0}  {1}" -f (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower(), $f
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VeilMark-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/VeilMark-Setup.exe
            dist/VeilMark-Portable.zip
            dist/SHA256SUMS.txt
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VeilMark ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/VeilMark-Setup.exe
            dist/VeilMark-Portable.zip
            dist/SHA256SUMS.txt
      - name: Publish to the releases/ folder (default branch, new version only)
        # Installed copies of VeilMark read releases/latest.json and download releases/VeilMark-Setup.exe.
        # Runs only after every test, the built-app smoke test and the installer test above have passed.
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $published = "0.0.0"
          if (Test-Path releases/latest.json) {
            $published = (Get-Content releases/latest.json -Raw | ConvertFrom-Json).version
          }
          if ([version]$v -le [version]$published) { "Version $v is already published ($published) - nothing to do."; exit 0 }
          New-Item -ItemType Directory -Force releases | Out-Null
          $exe = "VeilMark-Setup-$v.exe"              # every version keeps its own EXE in releases/
          Copy-Item dist/VeilMark-Setup.exe "releases/$exe" -Force
          $manifest = [ordered]@{
            version   = $v
            installer = $exe
            sha256    = (Get-FileHash "releases/$exe" -Algorithm SHA256).Hash.ToLower()
            size      = (Get-Item "releases/$exe").Length
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            commit    = "${{ github.sha }}"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM releases/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/latest.json "releases/$exe"
          git commit -m "Release VeilMark $v [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "push failed (the branch moved?) - push again to retry"; exit 1 }
          "Published VeilMark $v to releases/"

  build-macos:
    # Apple silicon natively; Intel with an Intel (x64) Python running under Rosetta on the same runner.
    runs-on: macos-latest
    timeout-minutes: 45
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            python-arch: arm64
            label: AppleSilicon
          - arch: x86_64
            python-arch: x64
            label: Intel
    defaults:
      run:
        # setup-python's "x64" Python is a universal binary that would still run natively on Apple silicon:
        # start every step under the wanted architecture (Rosetta for Intel); child processes inherit it
        shell: arch -${{ matrix.arch }} /bin/bash -e {0}
    env:
      VEILMARK_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - name: Check the Python processor type
        run: |
          m=$(python -c "import platform; print(platform.machine())")
          echo "Python runs as $m"
          [ "$m" = "${{ matrix.arch }}" ] || { echo "expected ${{ matrix.arch }}"; exit 1; }
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # the universal2 Python would let pip pick Apple-silicon-only wheels: ask for Intel ones only
            echo "_PYTHON_HOST_PLATFORM=macosx-14.0-x86_64" >> "$GITHUB_ENV"
            # newer releases of some libraries no longer ship Intel-Mac wheels: never compile them, take the newest
            # release that still has a prebuilt Intel wheel instead
            echo "PIP_ONLY_BINARY=cryptography,cffi,numpy,lxml,pillow,pyside6,pyside6-essentials,pyside6-addons,shiboken6" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests on the Mac (incl. cross-platform cipher vectors)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Read app version
        id: ver
        run: |
          v=$(python -c "import veilmark; print(veilmark.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $v (veilmark/__init__.py)"; exit 1
          fi
      - name: Build VeilMark.app with PyInstaller
        run: pyinstaller packaging/veilmark-macos.spec --noconfirm --clean
      - name: Check the app's Info.plist (a normal, foreground Mac app)
        run: |
          PL=dist/VeilMark.app/Contents/Info.plist
          plutil -p "$PL"
          # regression: LSBackgroundOnly=true made macOS send all typing to the previously active app
          [ "$(plutil -extract LSBackgroundOnly raw "$PL")" = "false" ] || { echo "app is marked background-only"; exit 1; }
          [ "$(plutil -extract CFBundleExecutable raw "$PL")" = "VeilMark" ] || { echo "wrong main executable"; exit 1; }
      - name: Sign (ad hoc) and build the disk image
        run: |
          bash packaging/make_dmg.sh
          test -f dist/VeilMark-macOS-${{ matrix.label }}.dmg
      - name: Smoke-test the app inside the disk image (embed + extract a real PowerPoint)
        env:
          VEILMARK_HOME: ${{ runner.temp }}/vmhome
        run: |
          set -e
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" dist/VeilMark-macOS-${{ matrix.label }}.dmg
          CLI="$MNT/VeilMark.app/Contents/MacOS/veilmark-cli"
          v=$("$CLI" --version); echo "$v"
          [[ "$v" == *"${{ steps.ver.outputs.version }}"* ]] || { echo "app reports '$v'"; exit 1; }
          codesign --verify --deep --strict "$MNT/VeilMark.app"
          python -c "import sys; sys.path.insert(0, 'tests'); from samples import make_pptx; make_pptx('${{ runner.temp }}/smoke.pptx')"
          "$CLI" embed "${{ runner.temp }}/smoke.pptx" --text "CI smoke test" --footer
          out=$("$CLI" extract "${{ runner.temp }}/smoke - watermarked.pptx"); echo "$out"
          upd=$("$CLI" check-update || true); echo "$upd"   # regression: HTTPS failed in the Mac app (no certificates)
          hdiutil detach "$MNT"
          grep -q "Watermark text: CI smoke test" <<< "$out" || { echo "built app could not extract the watermark"; exit 1; }
          grep -Eq "up to date|is available" <<< "$upd" || { echo "built app could not check GitHub for updates"; exit 1; }
      - name: Build the installer wizard (.pkg)
        run: |
          bash packaging/make_pkg.sh
          test -f dist/VeilMark-macOS-${{ matrix.label }}-Installer.pkg
      - name: Test the installer (install it, then run the installed app)
        run: |
          set -e
          PKG=dist/VeilMark-macOS-${{ matrix.label }}-Installer.pkg
          sudo installer -pkg "$PKG" -target /
          APP=/Applications/VeilMark.app
          v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          [ "$v" = "${{ steps.ver.outputs.version }}" ] || { echo "installed version is '$v'"; exit 1; }
          [ "$(plutil -extract LSBackgroundOnly raw "$APP/Contents/Info.plist")" = "false" ] || exit 1
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/veilmark-cli" --version
          upd=$("$APP/Contents/MacOS/veilmark-cli" check-update || true); echo "$upd"
          grep -Eq "up to date|is available" <<< "$upd" || { echo "installed app could not check for updates"; exit 1; }
          pkgutil --pkg-info com.ahmedwalid.veilmark
          # installing the same package again (an upgrade) must work too
          sudo installer -pkg "$PKG" -target /
          sudo rm -rf "$APP"; sudo pkgutil --forget com.ahmedwalid.veilmark
      - uses: actions/upload-artifact@v4
        with:
          name: VeilMark-macOS-${{ matrix.label }}
          path: |
            dist/VeilMark-macOS-${{ matrix.label }}.dmg
            dist/VeilMark-macOS-${{ matrix.label }}-Installer.pkg
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VeilMark ${{ steps.ver.outputs.version }}
          files: |
            dist/VeilMark-macOS-${{ matrix.label }}.dmg
            dist/VeilMark-macOS-${{ matrix.label }}-Installer.pkg

  publish-macos:
    # After the Windows job has published (so the two never push at the same moment), put the Mac disk images and
    # their manifests into releases/. Installed Mac copies read releases/latest-macos-<arm64|x86_64>.json.
    needs: [build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch tip, including the Windows release commit
      - uses: actions/download-artifact@v4
        with:
          pattern: VeilMark-macOS-*
          merge-multiple: true
          path: dist
      - name: Publish to the releases/ folder (new version only)
        run: |
          set -e
          ls -l dist
          python3 - <<'PY'
          import datetime, hashlib, json, os, re, shutil
          from pathlib import Path
          v = re.search(r'__version__ = "(.+?)"', Path("veilmark/__init__.py").read_text()).group(1)
          ver = lambda s: tuple(int(n) for n in re.findall(r"\d+", s or "0")[:4])
          Path("releases").mkdir(exist_ok=True)
          changed = []
          for arch, label in (("arm64", "AppleSilicon"), ("x86_64", "Intel")):
              dmg, manifest = Path(f"dist/VeilMark-macOS-{label}.dmg"), Path(f"releases/latest-macos-{arch}.json")
              if not dmg.exists():
                  print(f"No {label} build in this run - skipped."); continue
              published = json.loads(manifest.read_text())["version"] if manifest.exists() else "0.0.0"
              if ver(v) <= ver(published):
                  print(f"{label}: version {v} is already published ({published})."); continue
              name = f"VeilMark-macOS-{label}-{v}.dmg"   # every version keeps its own disk image in releases/
              shutil.copyfile(dmg, f"releases/{name}")
              data = Path(f"releases/{name}").read_bytes()
              # the installer wizard for people installing by hand (the app updates itself from the .dmg)
              pkg, setup = Path(f"dist/VeilMark-macOS-{label}-Installer.pkg"), f"VeilMark-macOS-{label}-Installer-{v}.pkg"
              shutil.copyfile(pkg, f"releases/{setup}")
              changed.append(f"releases/{setup}")
              manifest.write_text(json.dumps({
                  "version": v, "installer": name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data),
                  "setup": setup, "setup_sha256": hashlib.sha256(Path(f"releases/{setup}").read_bytes()).hexdigest(),
                  "published": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "commit": os.environ["GITHUB_SHA"]}, indent=2) + "\n")
              changed += [f"releases/{name}", str(manifest)]
          Path("changed.txt").write_text("\n".join(changed))
          PY
          if [ ! -s changed.txt ]; then echo "Nothing new to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs git add < changed.txt
          git commit -m "Release VeilMark for Mac $(python3 -c 'import veilmark; print(veilmark.__version__)') [skip ci]"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && { echo "Published the Mac build to releases/"; exit 0; }
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "push failed - push again to retry"; exit 1
