name: Test & build Windows app

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc libegl1 libxkbcommon0
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests on Windows (incl. cross-platform cipher vectors)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build app with PyInstaller
        run: pyinstaller packaging/veilmark.spec --noconfirm --clean
      - name: Smoke-test the built CLI
        shell: pwsh
        run: |
          .\dist\VeilMark\veilmark-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc packaging\installer.iss
      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path dist\VeilMark\* -DestinationPath dist\VeilMark-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VeilMark-Windows
          path: |
            dist/VeilMark-Setup-*.exe
            dist/VeilMark-Portable.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VeilMark-Setup-*.exe
            dist/VeilMark-Portable.zip
